services:
  mariadb:
    image: mariadb:11.4
    container_name: wishlist-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-wishlist}
      MARIADB_USER: ${DB_USER:-wishlist}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wishlistpass}
    ports:
      - '${DB_PORT:-3313}:3306'
    volumes:
      - wishlist-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches all outgoing dev email — view it at http://localhost:8028
  mailpit:
    image: axllent/mailpit:latest
    container_name: wishlist-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1028}:1025'
      - '${MAILPIT_UI_PORT:-8028}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  wishlist-db-data:
