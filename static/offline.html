<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>You're offline — Wrappy</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				--paper: #fafaf8;
				--ink: #1c1c1c;
				--ink2: #4a4a4a;
				--gold: #c9a24a;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--paper: #1a1a1a;
					--ink: #eceae4;
					--ink2: #c9c7c1;
					--gold: #d9b65e;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--paper);
				color: var(--ink);
				font: 16px/1.5 system-ui, sans-serif;
				text-align: center;
				padding: 0 16px;
			}
			svg {
				color: var(--gold);
			}
			h1 {
				font-size: 28px;
				margin: 12px 0 4px;
			}
			p {
				color: var(--ink2);
				margin: 0 0 20px;
			}
			button {
				font: inherit;
				padding: 10px 20px;
				border-radius: 999px;
				border: 0;
				background: var(--ink);
				color: var(--paper);
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13c2 1.5 3.5 3.5 4.5 5.5C11 12 15 7 21 3" /></svg>
			<h1>You're offline</h1>
			<p>Wrappy needs a connection to show your lists. Check your signal and try again.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
