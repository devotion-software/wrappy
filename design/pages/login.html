<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrappy — log in</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Patrick+Hand&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* Notebook theme tokens — see DESIGN.md */
:root { --desk: #ECECEA; --paper: #FAFAF8; --ink: #1C1C1C; --ink2: #4A4A4A; --muted: #5E5E5A; --faint: #6E6E6A; --rule: #E4E4E0; --line: #D2D2CE; --gold: #C9A24A; --gold-text: #8A6A1F; --on-gold: #1C1C1C; --gold-soft: #F4EEDD; --tape: rgba(160,160,155,0.28); --shadow: 0 1px 2px rgba(0,0,0,0.08), 0 10px 24px rgba(0,0,0,0.07); color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --desk: #0E0E0E; --paper: #1A1A1A; --ink: #ECEAE4; --ink2: #C9C7C1; --muted: #A8A8A4; --faint: #9C9A94; --rule: #2A2A2A; --line: #333333; --gold: #D9B65E; --gold-text: #D9B65E; --on-gold: #141414; --gold-soft: #2A261C; --tape: rgba(200,200,195,0.16); --shadow: 0 0 0 1px #2A2A2A; color-scheme: dark; } }
:root[data-theme="dark"] { --desk: #0E0E0E; --paper: #1A1A1A; --ink: #ECEAE4; --ink2: #C9C7C1; --muted: #A8A8A4; --faint: #9C9A94; --rule: #2A2A2A; --line: #333333; --gold: #D9B65E; --gold-text: #D9B65E; --on-gold: #141414; --gold-soft: #2A261C; --tape: rgba(200,200,195,0.16); --shadow: 0 0 0 1px #2A2A2A; color-scheme: dark; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
body{margin:0}a{color:inherit}input::placeholder{color:#8A8A86}
</style>
<script>/* preview helper: ?theme=dark or ?theme=light */
(function(){var m=location.search.match(/theme=(dark|light)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; background: var(--desk); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <a href="landing.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13c2 1.5 3.5 3.5 4.5 5.5C11 12 15 7 21 3"></path></svg>
      <span style="font-family: 'Caveat', cursive; font-size: 34px; font-weight: 700; line-height: 1">wrappy</span>
    </a>
    <p style="margin: 0; font-size: 15px; color: var(--ink2)">New here? <a href="#" style="color: var(--ink); font-weight: 600; text-underline-offset: 3px">Create an account</a></p>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px 80px">
    <div style="position: relative; width: 100%; max-width: 460px; background-color: var(--paper); border-radius: 4px; box-shadow: var(--shadow); padding: 44px 40px 36px 64px; box-sizing: border-box">
      <div style="position: absolute; left: 40px; top: 0; bottom: 0; width: 2px; background: var(--gold)"></div>
      <div style="position: absolute; top: -11px; left: 50%; width: 110px; height: 24px; margin-left: -55px; background: var(--tape); transform: rotate(-3deg)"></div>

      <h1 style="margin: 0; font-family: 'Caveat', cursive; font-size: 52px; line-height: 1; font-weight: 700">Welcome back</h1>
      <p style="margin: 8px 0 28px; font-size: 15px; color: var(--ink2)">Log in to see your lists and your Secret Santas.</p>

      <div style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="email" style="font-size: 13px; font-weight: 600; color: var(--ink2)">Email</label>
          <input id="email" type="email" placeholder="you@example.com" style="height: 44px; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 0 2px; font-family: 'Patrick Hand', cursive; font-size: 22px; color: var(--ink); outline-color: var(--gold)">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <label for="password" style="font-size: 13px; font-weight: 600; color: var(--ink2)">Password</label>
            <a href="#" style="font-size: 13px; color: var(--gold-text); text-underline-offset: 3px">Forgot it?</a>
          </div>
          <input id="password" type="password" placeholder="••••••••" style="height: 44px; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 0 2px; font-family: 'Inter', sans-serif; font-size: 18px; color: var(--ink); outline-color: var(--gold)">
        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink2)"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--gold); margin: 0">Keep me logged in</label>
        <a href="home.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: var(--gold); color: var(--on-gold); text-decoration: none; font-weight: 600; font-size: 16px">Log in</a>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; margin: 26px 0; color: var(--muted); font-size: 13px">
        <div style="flex: 1; height: 1px; background: var(--line)"></div><span>or</span><div style="flex: 1; height: 1px; background: var(--line)"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button style="height: 48px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 600 15px 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>Email me a login link</button>
        <button style="height: 48px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 15px 'Inter', sans-serif">Continue with Google</button>
        <button style="height: 48px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 15px 'Inter', sans-serif">Continue with Apple</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
